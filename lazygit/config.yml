gui:
  theme:
    selectedLineBgColor:
      - '#1e3260'
    selectedRangeBgColor:
      - '#1e3260'

customCommands:
  - key: 'o'
    context: 'files'
    command: 'if [ -n "$NVIM" ]; then nvim --server "$NVIM" --remote-send "<C-\><C-n>:q<CR>:tabedit {{.SelectedFile.Name}}<CR>"; else nvim "{{.SelectedFile.Name}}"; fi'
    description: 'Open file in a new nvim tab'
